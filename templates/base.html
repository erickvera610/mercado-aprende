<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercado Aprende</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header><a class="brand" href="{{ url_for('index') }}">m<span>ercado.</span></a><nav><a href="{{ url_for('index') }}">Explorar</a><a href="{{ url_for('sell') }}">Vender un producto</a>{% if g.user %}<a href="{{ url_for('account') }}">Mi cuenta</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="quiet">Salir</button></form>{% else %}<a href="{{ url_for('login') }}">Ingresar</a><a class="button" href="{{ url_for('register') }}">Crear cuenta</a>{% endif %}</nav></header>
<main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>Mercado Aprende · Proyecto educativo en Python · Compras simuladas, sin pagos ni envíos.</footer></body></html>
