{% extends 'base.html' %}{% block content %}<section class="panel"><p class="eyebrow">HAZ ESPACIO PARA ALGO NUEVO</p><h1>Publica tu producto</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Título<input name="title" required minlength="3" maxlength="80" value="{{ request.form.get('title','') }}"></label><label>Categoría<select name="category">{% for c in categories %}<option {% if request.form.get('category')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Estado<select name="condition">{% for c in conditions %}<option {% if request.form.get('condition')==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Precio en USD<input name="price" type="number" min="0.01" max="1000000" step="0.01" required value="{{ request.form.get('price','') }}"></label><label>Descripción<textarea name="description" required minlength="5" maxlength="1500">{{ request.form.get('description','') }}</textarea></label><button>Publicar producto</button></form></section>{% endblock %}
